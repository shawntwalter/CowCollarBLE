<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CowGateway Config</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐄</text></svg>">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #111113;
    --surface: #1c1c20;
    --surface-raised: #26262b;
    --border: #333338;
    --border-active: #52524e;
    --text: #e8e6e0;
    --text-dim: #8a8a82;
    --accent: #e89b2d;
    --accent-dim: #c07a1a;
    --green: #3ddc84;
    --green-dim: #2a9d5e;
    --red: #ef5350;
    --red-dim: #b33a38;
    --blue: #5b9cf5;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --radius: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ─────────────────────────────────── */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    backdrop-filter: blur(12px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand svg { width: 28px; height: 28px; }

  .brand h1 {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent);
  }

  .status-badge {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-badge .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  .status-badge.connected { border-color: var(--green-dim); color: var(--green); }
  .status-badge.connected .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-badge.error { border-color: var(--red-dim); color: var(--red); }
  .status-badge.error .dot { background: var(--red); }

  /* ── Main Layout ────────────────────────────── */
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── Cards ──────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .card-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-header h2 {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
  }

  .card-body { padding: 14px; }

  /* ── Connect Section ────────────────────────── */
  #connect-section .card-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .btn {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-dim); }
  .btn-primary:active { transform: scale(0.98); }

  .btn-danger {
    background: transparent;
    color: var(--red);
    border-color: var(--red-dim);
  }
  .btn-danger:hover { background: rgba(239,83,80,0.1); }

  .btn-save {
    background: var(--green);
    color: var(--bg);
    border-color: var(--green);
  }
  .btn-save:hover { background: var(--green-dim); }
  .btn-save:active { transform: scale(0.98); }

  .btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none !important;
  }

  /* ── Config Fields ──────────────────────────── */
  #config-section {
    display: none;
  }

  #config-section.visible { display: block; }

  .field-group {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field-group:last-child { border-bottom: none; }

  .field-label {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .field-label .tag {
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }

  .field-label .tag.read { color: var(--blue); border-color: rgba(91,156,245,0.3); }
  .field-label .tag.write { color: var(--accent); border-color: rgba(232,155,45,0.3); }

  input[type="text"],
  input[type="password"] {
    font-family: var(--mono);
    font-size: 14px;
    padding: 10px 12px;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    outline: none;
    width: 100%;
    transition: border-color 0.15s ease;
  }

  input:focus { border-color: var(--accent); }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
  }

  .toggle-label {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
  }

  /* Toggle Switch */
  .switch {
    position: relative;
    width: 48px;
    height: 26px;
  }

  .switch input { opacity: 0; width: 0; height: 0; }

  .slider {
    position: absolute;
    inset: 0;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 26px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .slider::before {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    left: 2px;
    bottom: 2px;
    background: var(--text-dim);
    border-radius: 50%;
    transition: all 0.2s ease;
  }

  .switch input:checked + .slider {
    background: var(--green-dim);
    border-color: var(--green);
  }

  .switch input:checked + .slider::before {
    transform: translateX(22px);
    background: var(--green);
  }

  /* ── Actions Bar ────────────────────────────── */
  #actions-section {
    display: none;
  }

  #actions-section.visible { display: block; }

  #actions-section .card-body {
    display: flex;
    gap: 10px;
  }

  /* ── Log Console ────────────────────────────── */
  .log {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-height: 180px;
    overflow-y: auto;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.7;
    color: var(--text-dim);
  }

  .log .entry { display: block; }
  .log .entry.error { color: var(--red); }
  .log .entry.success { color: var(--green); }
  .log .entry.info { color: var(--blue); }

  /* ── Unsupported Banner ─────────────────────── */
  .unsupported {
    background: rgba(239,83,80,0.08);
    border: 1px solid var(--red-dim);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: var(--red);
    line-height: 1.6;
  }

  .unsupported a { color: var(--accent); }

  /* ── Pulse animation ────────────────────────── */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .scanning { animation: pulse 1.2s ease-in-out infinite; }

  /* ── Scrollbar ──────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="28" height="28" rx="6" fill="#e89b2d" fill-opacity="0.15"/>
      <path d="M7 10c0-1 1-3 3-3s2 2 4 2 2-2 4-2 3 2 3 3v2c0 4-3 8-7 9-4-1-7-5-7-9v-2z" stroke="#e89b2d" stroke-width="1.5" fill="none"/>
      <circle cx="11" cy="12" r="1" fill="#e89b2d"/>
      <circle cx="17" cy="12" r="1" fill="#e89b2d"/>
    </svg>
    <h1>COW GATEWAY</h1>
  </div>
  <div class="status-badge" id="status-badge">
    <span class="dot"></span>
    <span id="status-text">OFFLINE</span>
  </div>
</header>

<main>

  <!-- Unsupported browser banner (hidden by default) -->
  <div class="unsupported" id="unsupported" style="display:none;">
    Web Bluetooth is not supported in this browser.<br>
    Use <a href="https://www.google.com/chrome/" target="_blank">Chrome</a> or
    <a href="https://www.microsoft.com/edge" target="_blank">Edge</a> on Android, macOS, Windows, or ChromeOS.
  </div>

  <!-- Connect -->
  <div class="card" id="connect-section">
    <div class="card-header">
      <h2>Connection</h2>
    </div>
    <div class="card-body">
      <div class="field-group" style="padding:0; border:none;">
        <div class="field-label">BLE PIN</div>
        <input type="text" id="pin-input" value="123456" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn btn-primary" id="btn-connect">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M18 12.5V18a1 1 0 01-1 1h-5.5M12.5 6H6a1 1 0 00-1 1v5.5"/><path d="M12 2l3 3-4 4 2 2 4-4 3 3V2h-8z"/></svg>
        SCAN &amp; CONNECT
      </button>
      <button class="btn btn-danger" id="btn-disconnect" style="display:none;">
        DISCONNECT
      </button>
    </div>
  </div>

  <!-- Config Fields -->
  <div class="card" id="config-section">
    <div class="card-header">
      <h2>Configuration</h2>
      <span id="auth-status" style="font-family:var(--mono);font-size:10px;color:var(--text-dim);">NOT AUTH</span>
    </div>
    <div class="field-group">
      <div class="field-label">
        WiFi SSID
        <span class="tag read">R</span><span class="tag write">W</span>
      </div>
      <input type="text" id="f-ssid" placeholder="network name" autocomplete="off" spellcheck="false">
    </div>
    <div class="field-group">
      <div class="field-label">
        WiFi Password
        <span class="tag write">W</span>
      </div>
      <input type="password" id="f-password" placeholder="••••••••" autocomplete="off">
    </div>
    <div class="field-group">
      <div class="field-label">
        API Endpoint
        <span class="tag read">R</span><span class="tag write">W</span>
      </div>
      <input type="text" id="f-endpoint" placeholder="https://api.example.com/upload" autocomplete="off" spellcheck="false">
    </div>
    <div class="field-group">
      <div class="field-label">
        API Key
        <span class="tag write">W</span>
      </div>
      <input type="password" id="f-apikey" placeholder="••••••••" autocomplete="off">
    </div>
    <div class="field-group">
      <div class="field-label">
        Upload Enabled
        <span class="tag read">R</span><span class="tag write">W</span>
      </div>
      <div class="toggle-row">
        <span class="toggle-label" id="upload-label">OFF</span>
        <label class="switch">
          <input type="checkbox" id="f-upload">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div id="actions-section">
    <div style="display:flex; gap:10px;">
      <button class="btn btn-primary" id="btn-write" style="flex:1;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4m-7 7l7-7 7 7"/></svg>
        WRITE ALL
      </button>
      <button class="btn btn-save" id="btn-save" style="flex:1;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        SAVE &amp; RESTART
      </button>
    </div>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="card-header">
      <h2>Log</h2>
      <span id="btn-clear-log" style="font-family:var(--mono);font-size:10px;color:var(--text-dim);cursor:pointer;">CLEAR</span>
    </div>
    <div class="log" id="log"></div>
  </div>

</main>

<script>
// ── UUIDs (match firmware) ───────────────────────────────────────────────────
const SERVICE   = '12345678-1234-1234-1234-123456789abc';
const UUID = {
  AUTH:     '12345678-1234-1234-1234-123456789001',
  SSID:     '12345678-1234-1234-1234-123456789002',
  PASS:     '12345678-1234-1234-1234-123456789003',
  ENDPOINT: '12345678-1234-1234-1234-123456789004',
  APIKEY:   '12345678-1234-1234-1234-123456789005',
  UPLOAD:   '12345678-1234-1234-1234-123456789006',
  SAVE:     '12345678-1234-1234-1234-123456789007',
};

// ── State ────────────────────────────────────────────────────────────────────
let device = null;
let server = null;
let service = null;
let chars = {};

const enc = new TextEncoder();
const dec = new TextDecoder();

// ── DOM refs ─────────────────────────────────────────────────────────────────
const $status    = document.getElementById('status-badge');
const $statusTxt = document.getElementById('status-text');
const $authStat  = document.getElementById('auth-status');
const $btnConn   = document.getElementById('btn-connect');
const $btnDisc   = document.getElementById('btn-disconnect');
const $config    = document.getElementById('config-section');
const $actions   = document.getElementById('actions-section');
const $log       = document.getElementById('log');
const $upload    = document.getElementById('f-upload');
const $uploadLbl = document.getElementById('upload-label');

// ── Check Web Bluetooth support ──────────────────────────────────────────────
if (!navigator.bluetooth) {
  document.getElementById('unsupported').style.display = 'block';
  $btnConn.disabled = true;
}

// ── Upload toggle label sync ─────────────────────────────────────────────────
$upload.addEventListener('change', () => {
  $uploadLbl.textContent = $upload.checked ? 'ON' : 'OFF';
});

// ── Logging ──────────────────────────────────────────────────────────────────
function log(msg, cls = '') {
  const el = document.createElement('span');
  el.className = 'entry ' + cls;
  const ts = new Date().toLocaleTimeString('en-US', { hour12: false });
  el.textContent = `[${ts}] ${msg}`;
  $log.appendChild(el);
  $log.appendChild(document.createElement('br'));
  $log.scrollTop = $log.scrollHeight;
}

function clearLog() { $log.innerHTML = ''; }

// ── Status UI ────────────────────────────────────────────────────────────────
function setStatus(state, text) {
  $status.className = 'status-badge ' + state;
  $statusTxt.textContent = text;
}

function showConnected() {
  setStatus('connected', 'CONNECTED');
  $btnConn.style.display = 'none';
  $btnDisc.style.display = 'flex';
  $config.classList.add('visible');
  $actions.classList.add('visible');
}

function showDisconnected() {
  setStatus('', 'OFFLINE');
  $btnConn.style.display = 'flex';
  $btnDisc.style.display = 'none';
  $config.classList.remove('visible');
  $actions.classList.remove('visible');
  $authStat.textContent = 'NOT AUTH';
  $authStat.style.color = 'var(--text-dim)';
  device = null; server = null; service = null; chars = {};
}

// ── Connect ──────────────────────────────────────────────────────────────────
async function doConnect() {
  // CRITICAL: requestDevice MUST be the very first async call in the
  // user-gesture handler — Bluefy blocks the picker if anything else
  // (logging, DOM updates, awaits) runs before it.
  let pickedDevice;
  try {
    pickedDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }],
      optionalServices: [SERVICE],
    });
  } catch (err1) {
    // If filters fail (some Bluefy versions), retry with acceptAllDevices
    if (err1.name === 'NotFoundError' || err1.name === 'NotSupportedError') {
      try {
        pickedDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE],
        });
      } catch (err2) {
        log('Scan cancelled or failed: ' + err2.message, 'error');
        return;
      }
    } else {
      log('Scan cancelled: ' + err1.message, 'error');
      return;
    }
  }

  // Now safe to do DOM updates and further async work
  try {
    device = pickedDevice;
    $btnConn.disabled = true;
    $btnConn.classList.add('scanning');
    log('Scanning for CowGateway…', 'info');

    device.addEventListener('gattserverdisconnected', () => {
      log('Device disconnected', 'error');
      showDisconnected();
    });

    log(`Found: ${device.name || 'unknown'}`, 'success');
    log('Connecting GATT…', 'info');
    server = await device.gatt.connect();

    log('Discovering service…', 'info');
    service = await server.getPrimaryService(SERVICE);

    // Cache all characteristics
    for (const [key, uuid] of Object.entries(UUID)) {
      chars[key] = await service.getCharacteristic(uuid);
    }
    log('All characteristics discovered', 'success');

    // Authenticate
    const pin = document.getElementById('pin-input').value;
    log('Authenticating…', 'info');
    await chars.AUTH.writeValue(enc.encode(pin));
    log('Auth PIN sent', 'success');
    $authStat.textContent = 'AUTH OK';
    $authStat.style.color = 'var(--green)';

    showConnected();

    // Read current values
    await readAll();

  } catch (err) {
    log('Error: ' + err.message, 'error');
    setStatus('error', 'ERROR');
  } finally {
    $btnConn.disabled = false;
    $btnConn.classList.remove('scanning');
  }
}

// ── Disconnect ───────────────────────────────────────────────────────────────
function doDisconnect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
  }
  log('Disconnected by user', 'info');
  showDisconnected();
}

// ── Read all readable characteristics ────────────────────────────────────────
async function readAll() {
  try {
    log('Reading config…', 'info');

    const ssidVal = await chars.SSID.readValue();
    document.getElementById('f-ssid').value = dec.decode(ssidVal);

    const endpointVal = await chars.ENDPOINT.readValue();
    document.getElementById('f-endpoint').value = dec.decode(endpointVal);

    const uploadVal = await chars.UPLOAD.readValue();
    const uploadStr = dec.decode(uploadVal);
    $upload.checked = (uploadStr === '1');
    $uploadLbl.textContent = $upload.checked ? 'ON' : 'OFF';

    log('Config loaded', 'success');
  } catch (err) {
    log('Read error: ' + err.message, 'error');
  }
}

// ── Write all fields ─────────────────────────────────────────────────────────
async function writeAll() {
  try {
    log('Writing config…', 'info');

    const ssid = document.getElementById('f-ssid').value;
    if (ssid) {
      await chars.SSID.writeValue(enc.encode(ssid));
      log('SSID written', 'success');
    }

    const pass = document.getElementById('f-password').value;
    if (pass) {
      await chars.PASS.writeValue(enc.encode(pass));
      log('Password written', 'success');
    }

    const endpoint = document.getElementById('f-endpoint').value;
    if (endpoint) {
      await chars.ENDPOINT.writeValue(enc.encode(endpoint));
      log('Endpoint written', 'success');
    }

    const apikey = document.getElementById('f-apikey').value;
    if (apikey) {
      await chars.APIKEY.writeValue(enc.encode(apikey));
      log('API key written', 'success');
    }

    const uploadVal = $upload.checked ? '1' : '0';
    await chars.UPLOAD.writeValue(enc.encode(uploadVal));
    log(`Upload enabled: ${uploadVal}`, 'success');

    log('All fields written ✓', 'success');
  } catch (err) {
    log('Write error: ' + err.message, 'error');
  }
}

// ── Save & Restart ───────────────────────────────────────────────────────────
async function doSave() {
  try {
    log('Sending SAVE command…', 'info');
    await chars.SAVE.writeValue(enc.encode('1'));
    log('Save sent — device will restart', 'success');
    // The device will disconnect itself after restarting
  } catch (err) {
    log('Save error: ' + err.message, 'error');
  }
}

// ── Event Listeners (addEventListener for Bluefy gesture trust) ──────────────
$btnConn.addEventListener('click', doConnect);
document.getElementById('btn-disconnect').addEventListener('click', doDisconnect);
document.getElementById('btn-write').addEventListener('click', writeAll);
document.getElementById('btn-save').addEventListener('click', doSave);
document.getElementById('btn-clear-log').addEventListener('click', clearLog);

// ── Service Worker Registration ──────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => {
    console.log('[SW] Registered');
  }).catch(err => console.warn('[SW] Registration failed:', err));
}
</script>

</body>
</html>
